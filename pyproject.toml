[project]
name = "segmentation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
viewer = [
    "streamlit>=1.49,<2",
    "Pillow>=10",
]
train = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
